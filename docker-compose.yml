services:
  bot:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: ${TZ:-UTC}
      DRY_RUN: ${DRY_RUN:-true}
      EXCHANGE_NAME: ${EXCHANGE_NAME:-binance}
      EXCHANGE_SANDBOX: ${EXCHANGE_SANDBOX:-true}
      EXCHANGE_API_KEY: ${EXCHANGE_API_KEY:-}
      EXCHANGE_SECRET_KEY: ${EXCHANGE_SECRET_KEY:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data/state:/app/data/state
      - ./data/memory:/app/data/memory
      - ./models:/app/models:ro
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=256m]

  dashboard:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: ${TZ:-UTC}
    command: ["streamlit", "run", "scripts/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    volumes:
      - ./data/state:/app/data/state:ro
      - ./data/memory:/app/data/memory:ro
      - ./models:/app/models:ro
    ports: ["127.0.0.1:8501:8501"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=256m]
    depends_on: [bot]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  prometheus_data:
