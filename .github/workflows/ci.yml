name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, "claude/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install the CPU PyTorch runtime required by the inference and bot tests.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install everything else except optional/heavy packages with incompatible
          # or git-only dependencies that are not required by the test suite.
          grep -v -E "^torch|^pytorch-lightning|^flair|^arch|^quantmind|^#" requirements.txt | pip install -r /dev/stdin

      - name: Syntax check
        run: |
          python -m py_compile scripts/app.py
          python -m py_compile scripts/bot.py
          python -m py_compile scripts/agents/market_analyst.py
          python -m py_compile scripts/agents/trading_strategist.py
          python -m py_compile scripts/agents/risk_analyst.py
          python -m py_compile scripts/agents/backtest_engineer.py
          python -m py_compile scripts/agents/orchestrator.py
          python -m py_compile scripts/quantmind_client.py
          python -m py_compile scripts/research_updater.py

      - name: Run full automated test suite
        run: python -m pytest tests -v --tb=short

      - name: Validate deployment configuration
        run: |
          cp .env.example .env
          docker compose config -q
          python -c "import yaml; yaml.safe_load(open('config.yaml')); yaml.safe_load(open('docker-compose.yml')); yaml.safe_load(open('deployment/prometheus.yml'))"

      - name: Verify sample data exists
        run: python -c "import pandas as pd; df = pd.read_csv('data/sample_ohlcv.csv'); assert len(df) >= 4000, f'Expected >=4000 rows, got {len(df)}'"
